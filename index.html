<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>Dossiê NIW — Triagem</title>

<!-- PWA / tela cheia -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<meta name="mobile-web-app-capable" content="yes">

<!-- iOS: abrir sem barra do Safari ao adicionar à tela de início -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dossiê NIW">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1B2A4A;
    --ink-soft: #2E3F63;
    --parchment: #F7F3EA;
    --parchment-dim: #EFE9DA;
    --brass: #B08D57;
    --brass-dark: #8C6F42;
    --slate: #5B6472;
    --line: #D9D2C0;
    --success: #3F6B4F;
    --success-bg: #E9F1EC;
    --warn: #C98A2C;
    --warn-bg: #FBF0DF;
    --danger: #B33A3A;
    --danger-bg: #F9E9E7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--parchment);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(176,141,87,0.06), transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(27,42,74,0.05), transparent 40%);
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  h1,h2,h3{ font-family: 'Source Serif 4', serif; font-weight: 600; margin: 0; color: var(--ink); }
  .mono{ font-family: 'IBM Plex Mono', monospace; }
  #root{ min-height: 100vh; }

  .shell{ max-width: 640px; margin: 0 auto; padding: 20px 18px 60px; }

  /* Header / masthead */
  .masthead{ display:flex; align-items:center; justify-content:space-between; padding: 10px 2px 22px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .masthead .brand{ display:flex; align-items:center; gap:10px; }
  .seal{ width:34px; height:34px; border-radius:50%; border:1.5px solid var(--brass); display:flex; align-items:center; justify-content:center; font-family:'Source Serif 4',serif; font-weight:700; color:var(--brass-dark); font-size:14px; flex:none; }
  .brand-text .kicker{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--brass-dark); font-weight:600; }
  .brand-text h1{ font-size:19px; line-height:1.1; }
  .logout{ background:none; border:none; color:var(--slate); font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* Auth card */
  .auth-wrap{ display:flex; align-items:center; justify-content:center; min-height: 90vh; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:2px; padding:28px 24px; box-shadow: 0 1px 2px rgba(27,42,74,0.04), 0 8px 24px rgba(27,42,74,0.06); }
  .auth-card{ width:100%; max-width:380px; }
  .auth-card .stamp-corner{ display:flex; justify-content:center; margin-bottom:14px; }
  .auth-card h2{ font-size:22px; text-align:center; margin-bottom:6px; }
  .auth-sub{ text-align:center; color:var(--slate); font-size:13.5px; margin-bottom:22px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; letter-spacing:0.02em; color:var(--ink-soft); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:2px;
    font-family:'Inter',sans-serif; font-size:14.5px; background:#FCFAF5; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  .field textarea{ resize:vertical; min-height:76px; line-height:1.5; }
  .hint{ font-size:11.5px; color:var(--slate); margin-top:4px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--ink); color:#fff; border:none; padding:12px 18px; border-radius:2px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px; cursor:pointer; width:100%;
    transition: background .15s ease;
  }
  .btn:hover{ background: var(--ink-soft); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-ghost{ background:none; color:var(--ink); border:1px solid var(--line); }
  .btn-ghost:hover{ background: var(--parchment-dim); }
  .btn-row{ display:flex; gap:10px; }
  .switch-mode{ text-align:center; margin-top:16px; font-size:13px; color:var(--slate); }
  .switch-mode button{ background:none; border:none; color:var(--brass-dark); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:2px; font-size:13px; padding:0; }
  .error-msg{ background: var(--danger-bg); color:var(--danger); padding:10px 12px; border-radius:2px; font-size:13px; margin-bottom:14px; border:1px solid rgba(179,58,58,0.25); }

  /* Progress / folder tabs */
  .folder-tabs{ display:flex; gap:6px; margin-bottom:22px; }
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:2px 2px 0 0;
    font-size:11px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase;
    color: var(--slate); background: var(--parchment-dim); border-bottom:3px solid transparent;
    transition: all .15s ease;
  }
  .tab.active{ color: var(--ink); background:#fff; border-bottom-color: var(--brass); }
  .tab.done{ color: var(--success); }

  .step-card{ background:#fff; border:1px solid var(--line); padding:24px 20px; border-radius:2px; }
  .step-eyebrow{ font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--brass-dark); font-weight:600; margin-bottom:6px; }
  .step-title{ font-size:21px; margin-bottom:6px; }
  .step-desc{ color:var(--slate); font-size:13.5px; line-height:1.5; margin-bottom:20px; }

  .radio-group{ display:flex; flex-direction:column; gap:8px; }
  .radio-option{
    display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border:1px solid var(--line);
    border-radius:2px; cursor:pointer; transition: border-color .15s, background .15s;
  }
  .radio-option:hover{ border-color: var(--brass); }
  .radio-option.selected{ border-color: var(--brass); background: rgba(176,141,87,0.06); }
  .radio-option input{ margin-top:2px; accent-color: var(--brass-dark); }
  .radio-option .opt-text{ font-size:14px; line-height:1.4; }
  .radio-option .opt-text small{ display:block; color:var(--slate); font-size:12px; margin-top:2px; }

  .checklist{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .check-item{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:2px; cursor:pointer; }
  .check-item.checked{ border-color: var(--brass); background: rgba(176,141,87,0.06); }
  .check-item input{ margin-top:2px; accent-color: var(--brass-dark); }
  .check-item span{ font-size:13.5px; line-height:1.4; }
  .crit-counter{ margin-top:12px; padding:9px 12px; border-radius:2px; font-size:13px; font-weight:600; }
  .crit-counter.ok{ background: var(--success-bg); color: var(--success); }
  .crit-counter.low{ background: var(--warn-bg); color: var(--warn); }

  .strength-picker{ display:flex; gap:6px; margin-top:6px; }
  .strength-btn{ flex:1; padding:8px 4px; text-align:center; border:1px solid var(--line); border-radius:2px; font-size:12.5px; font-weight:600; cursor:pointer; background:#fff; color:var(--slate); }
  .strength-btn.fraco.active{ background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .strength-btn.moderado.active{ background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .strength-btn.forte.active{ background: var(--success-bg); border-color: var(--success); color: var(--success); }

  .prong-block{ margin-bottom:22px; padding-bottom:20px; border-bottom:1px solid var(--line); }
  .prong-block:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .prong-num{ display:inline-flex; align-items:center; gap:8px; font-family:'Source Serif 4',serif; font-weight:700; font-size:15px; color:var(--brass-dark); margin-bottom:10px; }
  .prong-num .circ{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--brass); display:flex; align-items:center; justify-content:center; font-size:12px; }

  .step-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:24px; }
  .step-nav .btn{ width:auto; padding:12px 22px; }

  /* Alert boxes */
  .alert-box{ padding:14px 16px; border-radius:2px; font-size:13.5px; line-height:1.55; margin-top:16px; border:1px solid; }
  .alert-box.red{ background: var(--danger-bg); border-color: rgba(179,58,58,0.3); color:#7a2626; }
  .alert-box.amber{ background: var(--warn-bg); border-color: rgba(201,138,44,0.3); color:#7a541b; }
  .alert-box.green{ background: var(--success-bg); border-color: rgba(63,107,79,0.3); color:#26472f; }
  .alert-box .alert-title{ font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
  .countdown{ font-family:'IBM Plex Mono',monospace; font-weight:600; }

  /* Results screen */
  .result-hero{ text-align:center; padding: 8px 0 20px; }
  .result-hero .seal-lg{ width:64px; height:64px; border-radius:50%; border:2px solid var(--brass); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-family:'Source Serif 4',serif; font-weight:700; font-size:24px; color:var(--brass-dark); }
  .result-hero h2{ font-size:24px; margin-bottom:6px; }
  .result-hero p{ color:var(--slate); font-size:14px; }
  .summary-grid{ display:flex; flex-direction:column; gap:10px; margin: 20px 0; }
  .summary-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:#fff; border:1px solid var(--line); border-radius:2px; }
  .summary-row .label{ font-size:13px; color:var(--slate); }
  .summary-row .value{ font-weight:700; font-size:13.5px; }
  .tag{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:0.02em; }
  .tag.forte{ background: var(--success-bg); color: var(--success); }
  .tag.moderado{ background: var(--warn-bg); color: var(--warn); }
  .tag.fraco{ background: var(--danger-bg); color: var(--danger); }

  .loading-line{ text-align:center; padding:60px 0; color: var(--slate); font-size:14px; }
</style>
</head>
<body>
<div id="root"></div>
